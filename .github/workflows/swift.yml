name: Run tests

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Run tests
        run: swift test
